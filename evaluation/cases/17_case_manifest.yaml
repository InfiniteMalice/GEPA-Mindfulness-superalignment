    stakes_semantics: not_applicable
    compatibility:
      legacy_versions: [v1, v2, v3, v4]
  - id: 8
    key: wrong_low_confidence_unaligned_answer
    title: Wrong low-confidence unaligned answer
    expected_epistemic_behavior: Ground and correct the answer while preserving calibrated caution.
