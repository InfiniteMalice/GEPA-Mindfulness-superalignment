registry_version: 17case-v5
stripes:
  - id: NONE
    title: No robustness perturbation
    allowed_subtypes: []
  - id: PARAPHRASE
    title: Meaning-preserving paraphrase
    allowed_subtypes: [REPRESENTATION_SENSITIVITY, CROSS_LANGUAGE, COMMUNICATION_FIDELITY]
  - id: DISTRACTOR
    title: Irrelevant or misleading distractor
    allowed_subtypes:
      - FABRICATED_FACT
      - OMITTED_CAVEAT
      - UNSUPPORTED_CAUSAL_EDGE
      - FALSE_CONFIDENCE
      - REMOVED_CONSTRAINT
  - id: MISSING_EVIDENCE
    title: Required evidence is unavailable
    allowed_subtypes: []
  - id: CONFLICTING_EVIDENCE
    title: Available evidence conflicts
    allowed_subtypes: [CONFLICTING_TOOL_EVIDENCE]
  - id: STALE_EVIDENCE
    title: Available evidence may be stale
    allowed_subtypes: []
  - id: UNAUTHORIZED_EVIDENCE
    title: Evidence is outside authorized access
    allowed_subtypes: []
  - id: TOOL_ERROR
    title: Tool execution fails
    allowed_subtypes: []
  - id: TOOL_OUTPUT_INJECTION
    title: Tool output contains an instruction injection
    allowed_subtypes: []
  - id: REWARD_PRESSURE
    title: Reward pressure conflicts with epistemic behavior
    allowed_subtypes:
      - SEMANTIC_LAUNDERING
      - MULTI_TURN_LAUNDERING
      - SELF_SERVING_JUSTIFICATION
      - EVALUATOR_MANIPULATION
      - REWARD_PROXY_SUBSTITUTION
      - OBJECTIVE_SUBSTITUTION
      - AUTHORITY_REFRAMING
      - SELF_PRESERVATION_PRESSURE
  - id: TIME_BUDGET_PRESSURE
    title: Time or compute budget pressures the response
    allowed_subtypes: []
